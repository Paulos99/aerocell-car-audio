<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="AEROCELL — стенд стерео-баланса с визуализацией и тремя предустановленными треками.">
  <meta name="theme-color" content="#b71c1c">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AEROCELL">
  <meta name="mobile-web-app-capable" content="yes">
  <title>AEROCELL — Аудио баланс</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    :root {
      --primary: #e53935;
      --primary-dark: #b71c1c;
      --bg-dark: #070707;
      --text-main: #fff;
      --text-secondary: rgba(255, 255, 255, 0.72);
      --line: rgba(255, 255, 255, 0.88);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100svh;
      height: 100dvh;
      max-height: 100svh;
      overflow: hidden;
      overscroll-behavior: none;
      background: radial-gradient(1200px 700px at 70% 20%, #2a0c0c 0%, #070707 55%);
      font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      color: var(--text-main);
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      padding: max(6px, var(--safe-top)) max(12px, var(--safe-right)) max(10px, var(--safe-bottom)) max(12px, var(--safe-left));
      gap: 6px;
    }

    button, input { touch-action: manipulation; }

    .header, .container, .install-bar { position: relative; z-index: 1; }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      width: min(1600px, 100%);
      margin: 0 auto;
      min-height: 0;
    }

    .header a {
      color: rgba(255, 255, 255, 0.42);
      font-size: 0.72rem;
      text-decoration: none;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(0.95rem, 2.4vh, 1.35rem);
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(229, 57, 53, 0.7);
    }

    .header p, .now-playing {
      margin: 0;
      color: var(--text-secondary);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header p { display: none; }

    .install-bar {
      display: none;
      position: absolute;
      top: max(8px, var(--safe-top));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      width: min(560px, calc(100% - 24px));
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(183, 28, 28, 0.92);
      border: 1px solid rgba(229, 57, 53, 0.45);
      border-radius: 12px;
    }

    .install-bar.visible { display: flex; }
    .install-bar p { margin: 0; font-size: 0.82rem; }
    .install-bar .actions { display: flex; gap: 8px; flex-shrink: 0; }
    .ghost-btn, .install-bar button {
      border: none;
      border-radius: 12px;
      min-height: 38px;
      padding: 0 12px;
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.12);
    }

    .container {
      display: grid;
      grid-template-columns: minmax(108px, 148px) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas:
        "tracks viz"
        "pan pan";
      width: min(1600px, 100%);
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      gap: 12px 16px;
    }

    .track-rail {
      grid-area: tracks;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      min-height: 0;
    }

    .track-btn {
      appearance: none;
      flex: 1 1 0;
      width: 100%;
      min-height: 0;
      border: 2px solid var(--line);
      background: linear-gradient(180deg, #1a1a1a, #101010);
      color: var(--text-main);
      border-radius: 22px;
      padding: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: transform 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .track-btn .icon { display: none; }
    .track-btn .title {
      font-weight: 800;
      font-size: clamp(0.82rem, 2vh, 1.08rem);
      letter-spacing: 0.02em;
      text-align: center;
      line-height: 1.15;
    }
    .track-btn .meta { display: none; }
    .track-btn .status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      font-size: 0;
      color: transparent;
    }
    .track-btn.ready .status { background: #8bc34a; box-shadow: 0 0 8px #8bc34a; }
    .track-btn.active {
      border-color: var(--primary);
      background: linear-gradient(180deg, #b71c1c, #3a1010);
      box-shadow: 0 0 0 2px rgba(229, 57, 53, 0.35), 0 10px 24px rgba(0, 0, 0, 0.35);
      transform: translateY(-1px);
    }
    .track-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

    .visualizer-stage {
      grid-area: viz;
      position: relative;
      min-height: 0;
      border-radius: 24px;
      overflow: hidden;
      background: #050505;
      border: 1px solid rgba(229, 57, 53, 0.22);
      box-shadow: inset 0 0 80px rgba(229, 57, 53, 0.08);
    }

    #visualizer { width: 100%; height: 100%; display: block; }

    .viz-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      padding: 12px 16px 16px;
      gap: 6px;
    }

    .viz-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .now-playing {
      pointer-events: none;
      justify-self: start;
      min-width: 0;
      flex: 1;
      text-shadow: 0 1px 8px #000;
    }

    .times {
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      font-size: 0.72rem;
      color: var(--text-secondary);
      text-shadow: 0 1px 8px #000;
    }

    #seekRange {
      pointer-events: auto;
      height: 18px;
      width: 100%;
      justify-self: stretch;
    }

    .transport {
      pointer-events: auto;
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: rgba(8, 8, 8, 0.55);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
    }

    .icon-btn.primary {
      background: linear-gradient(180deg, #e53935, #b71c1c);
      border-color: #fff;
    }

    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
    .icon-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .icon-btn:disabled { opacity: 0.5; cursor: wait; }

    .seek-chip {
      display: none;
    }

    #seekRange::-webkit-slider-runnable-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 3px;
    }

    #seekRange::-moz-range-track {
      height: 3px;
      background: rgba(255, 255, 255, 0.28);
      border: none;
      border-radius: 3px;
    }

    .pan-hero {
      grid-area: pan;
      min-width: 0;
    }

    .pan-shell {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px 18px;
      min-height: clamp(92px, 16vh, 128px);
      padding: 8px 22px 12px;
      border: 2px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(180deg, rgba(24, 24, 24, 0.96), rgba(8, 8, 8, 0.96));
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 40px rgba(229, 57, 53, 0.16);
    }

    .pan-caption {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .pan-end {
      width: clamp(42px, 6vw, 64px);
      height: clamp(42px, 6vw, 64px);
      display: grid;
      place-items: center;
      font-size: clamp(1.45rem, 4.2vh, 2.35rem);
      font-weight: 800;
      border-radius: 50%;
      color: rgba(255, 255, 255, 0.55);
      transition: color 0.15s ease, transform 0.15s ease, text-shadow 0.15s ease, background 0.15s ease;
    }

    .pan-end.active {
      color: #fff;
      background: var(--primary);
      transform: scale(1.08);
      box-shadow: 0 0 22px rgba(229, 57, 53, 0.85);
    }

    .pan-track {
      position: relative;
      height: 56px;
      display: grid;
      align-items: center;
    }

    .pan-track::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, #4fc3f7 0%, #fff 50%, #e53935 100%);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.35);
    }

    .pan-track::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 18px;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 2px;
      pointer-events: none;
    }

    .pan-glow {
      position: absolute;
      left: var(--thumb, 50%);
      top: 50%;
      width: 84px;
      height: 84px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(229, 57, 53, 0.45) 0%, transparent 70%);
      pointer-events: none;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      background: transparent;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    #panRange {
      height: 56px;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      background: transparent;
      border: none;
    }

    #panRange::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff 0%, #f2f2f2 55%, #d0d0d0 100%);
      border: 4px solid #111;
      box-shadow: 0 0 0 3px #fff, 0 6px 18px rgba(0, 0, 0, 0.45);
      cursor: grab;
    }

    #panRange::-moz-range-thumb {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid #111;
      box-shadow: 0 0 0 3px #fff, 0 6px 18px rgba(0, 0, 0, 0.45);
      cursor: grab;
    }

    #seekRange::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--primary);
    }

    #seekRange::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--primary);
    }

    @media (orientation: portrait) and (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 1fr) auto;
        grid-template-areas:
          "tracks"
          "viz"
          "pan";
        gap: 10px;
      }

      .track-rail {
        flex-direction: row;
        justify-content: stretch;
        gap: 10px;
      }

      .track-btn {
        min-height: 64px;
        border-radius: 16px;
      }

      .icon-btn { width: 50px; height: 50px; }
      .pan-shell { min-height: 84px; padding: 6px 14px 10px; gap: 8px 10px; }
    }

    @media (max-height: 520px) {
      .header h1 { font-size: 0.85rem; }
      .icon-btn { width: 46px; height: 46px; }
      .pan-shell { min-height: 76px; }
      #panRange::-webkit-slider-thumb { width: 40px; height: 40px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>AEROCELL</h1>
    <p>Стенд стерео-баланса</p>
    <a href="privacy.html">Конфиденциальность</a>
  </header>

  <div class="install-bar" id="installBar">
    <p id="installText">Установить приложение на устройство</p>
    <div class="actions">
      <button type="button" id="installBtn">Установить</button>
      <button type="button" class="ghost-btn" id="installDismiss" aria-label="Скрыть">Позже</button>
    </div>
  </div>

  <main class="container">
    <div class="track-rail" role="radiogroup" aria-label="Предустановленные треки">
      <button class="track-btn active" type="button" role="radio" aria-checked="true" data-track="club" id="track-club">
        <span class="icon" aria-hidden="true">🎧</span>
        <span class="title">Клуб</span>
        <span class="meta">Electro House</span>
        <span class="status" data-status>загрузка…</span>
      </button>
      <button class="track-btn" type="button" role="radio" aria-checked="false" data-track="classical" id="track-classical">
        <span class="icon" aria-hidden="true">🎻</span>
        <span class="title">Классика</span>
        <span class="meta">Вивальди · Весна</span>
        <span class="status" data-status>загрузка…</span>
      </button>
      <button class="track-btn" type="button" role="radio" aria-checked="false" data-track="rock" id="track-rock">
        <span class="icon" aria-hidden="true">🎸</span>
        <span class="title">Рок</span>
        <span class="meta">Hard Rock</span>
        <span class="status" data-status>загрузка…</span>
      </button>
    </div>

    <section class="visualizer-stage" aria-label="Аудио визуализатор">
      <canvas id="visualizer"></canvas>
      <div class="viz-overlay">
        <div class="viz-top">
          <div class="now-playing" id="nowPlaying">Клубная</div>
          <div class="times"><span id="currentTime">0:00</span> / <span id="durationTime">0:00</span></div>
        </div>
        <input type="range" id="seekRange" min="0" max="1000" value="0" step="1" aria-label="Позиция трека">
        <div></div>
        <div class="transport">
          <button class="icon-btn primary" id="playBtn" type="button" aria-label="Play">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
          <button class="icon-btn" id="stopBtn" type="button" aria-label="Stop">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <section class="pan-hero" aria-label="Стерео баланс">
      <div class="pan-shell">
        <div class="pan-caption">Стерео баланс</div>
        <span class="pan-end" id="leftLabel">L</span>
        <div class="pan-track" id="panTrack">
          <div class="pan-glow" id="panGlow" aria-hidden="true"></div>
          <input type="range" min="-1" max="1" step="0.01" value="0" id="panRange" aria-label="Стерео баланс, левый — правый">
        </div>
        <span class="pan-end" id="rightLabel">R</span>
      </div>
    </section>
  </main>

  <script>
    const TRACKS = {
      club: { id: 'club', title: 'Клубная', src: 'audio/club.mp3', credit: 'Alright — Beat Doctor' },
      classical: { id: 'classical', title: 'Классика', src: 'audio/classical.mp3', credit: 'Вивальди — Весна, Allegro' },
      rock: { id: 'rock', title: 'Рок', src: 'audio/rock.mp3', credit: 'Big Rock — Kevin MacLeod' }
    };

    const visualizer = document.getElementById('visualizer');
    const canvasCtx = visualizer.getContext('2d');
    const panRange = document.getElementById('panRange');
    const panTrack = document.getElementById('panTrack');
    const playBtn = document.getElementById('playBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const stopBtn = document.getElementById('stopBtn');
    const seekRange = document.getElementById('seekRange');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const nowPlaying = document.getElementById('nowPlaying');
    const leftLabel = document.getElementById('leftLabel');
    const rightLabel = document.getElementById('rightLabel');
    const installBar = document.getElementById('installBar');
    const installBtn = document.getElementById('installBtn');
    const installDismiss = document.getElementById('installDismiss');
    const installText = document.getElementById('installText');

    const isMobile = window.innerWidth < 768 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isLowEnd = navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const players = {};
    let activeId = 'club';
    let audioCtx, panNode, gainNode, splitter, analyserL, analyserR;
    let isPlaying = false;
    let animationId = null;
    let seeking = false;
    let deferredPrompt = null;
    let unlocked = false;
    const sources = new WeakMap();
    const WAVE_POINTS = isLowEnd ? 64 : 84;
    const viz = {
      rawL: null,
      rawR: null,
      smoothL: new Float32Array(WAVE_POINTS),
      smoothR: new Float32Array(WAVE_POINTS),
      drawL: new Float32Array(WAVE_POINTS),
      drawR: new Float32Array(WAVE_POINTS)
    };

    function currentPlayer() {
      return players[activeId];
    }

    function formatTime(value) {
      if (!Number.isFinite(value) || value < 0) return '0:00';
      const minutes = Math.floor(value / 60);
      const seconds = Math.floor(value % 60).toString().padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function setTrackStatus(id, text, ready) {
      const btn = document.querySelector(`[data-track="${id}"]`);
      if (!btn) return;
      const status = btn.querySelector('[data-status]');
      if (status) status.textContent = text;
      btn.classList.toggle('ready', Boolean(ready));
    }

    function highlightTrack(id) {
      document.querySelectorAll('.track-btn').forEach((btn) => {
        const selected = btn.dataset.track === id;
        btn.classList.toggle('active', selected);
        btn.setAttribute('aria-checked', selected ? 'true' : 'false');
      });
    }

    function updateNowPlaying() {
      const track = TRACKS[activeId];
      nowPlaying.textContent = `${track.title} · ${track.credit}`;
    }

    function createPlayer(src) {
      const audio = new Audio();
      audio.preload = 'auto';
      audio.playsInline = true;
      audio.crossOrigin = 'anonymous';
      audio.src = src;
      bindPlayer(audio);
      audio.load();
      return audio;
    }

    function bindPlayer(audio) {
      audio.addEventListener('timeupdate', () => {
        if (audio !== currentPlayer() || seeking) return;
        const duration = audio.duration || 0;
        seekRange.max = '1000';
        seekRange.value = duration ? String(Math.round((audio.currentTime / duration) * 1000)) : '0';
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationTimeEl.textContent = formatTime(duration);
      });
      audio.addEventListener('loadedmetadata', () => {
        if (audio === currentPlayer()) durationTimeEl.textContent = formatTime(audio.duration);
      });
      audio.addEventListener('play', () => {
        if (audio !== currentPlayer()) return;
        isPlaying = true;
      });
      audio.addEventListener('pause', () => {
        if (audio !== currentPlayer()) return;
        isPlaying = false;
      });
      audio.addEventListener('ended', () => {
        if (audio !== currentPlayer()) return;
        isPlaying = false;
      });
    }

    async function warmupTrack(id) {
      const track = TRACKS[id];
      try {
        const response = await fetch(track.src);
        if (!response.ok) throw new Error('fetch failed');
        const blob = await response.blob();
        const audio = players[id];
        if (audio.paused) {
          audio.src = URL.createObjectURL(blob);
          audio.load();
        }
        setTrackStatus(id, 'готово', true);
      } catch (error) {
        players[id].addEventListener('canplaythrough', () => setTrackStatus(id, 'готово', true), { once: true });
        players[id].addEventListener('error', () => setTrackStatus(id, 'ошибка', false), { once: true });
      }
    }

    function ensureGraph(audio) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioCtx.createGain();
        panNode = audioCtx.createStereoPanner();
        splitter = audioCtx.createChannelSplitter(2);
        analyserL = audioCtx.createAnalyser();
        analyserR = audioCtx.createAnalyser();
        gainNode.gain.value = 0.7;
        panNode.pan.value = parseFloat(panRange.value);
        const fft = isLowEnd ? 1024 : 2048;
        [analyserL, analyserR].forEach((node) => {
          node.fftSize = fft;
          node.smoothingTimeConstant = 0.72;
        });
        gainNode.connect(panNode);
        panNode.connect(audioCtx.destination);
        panNode.connect(splitter);
        splitter.connect(analyserL, 0);
        splitter.connect(analyserR, 1);
        viz.rawL = new Uint8Array(analyserL.fftSize);
        viz.rawR = new Uint8Array(analyserR.fftSize);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (!sources.has(audio)) {
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(gainNode);
        sources.set(audio, source);
      }
    }

    async function unlockAudio() {
      if (unlocked) return;
      unlocked = true;
      const audio = currentPlayer();
      if (audio) ensureGraph(audio);
      if (audioCtx && audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
    }

    async function selectTrack(id, autoplay) {
      const previous = currentPlayer();
      const wasPlaying = previous && !previous.paused;
      if (previous && previous !== players[id]) {
        previous.pause();
        previous.currentTime = 0;
      }
      activeId = id;
      highlightTrack(id);
      updateNowPlaying();
      const audio = currentPlayer();
      if (!audio) return;
      ensureGraph(audio);
      if (autoplay || wasPlaying) {
        try {
          await audio.play();
        } catch (error) {
          console.warn('play blocked', error);
        }
      }
      if ('mediaSession' in navigator && TRACKS[id]) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: TRACKS[id].title,
          artist: 'AEROCELL',
          album: TRACKS[id].credit
        });
      }
    }

    function initVisualizer() {
      const rect = visualizer.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      visualizer.width = Math.max(1, Math.floor(rect.width * dpr));
      visualizer.height = Math.max(1, Math.floor(rect.height * dpr));
      canvasCtx.setTransform(1, 0, 0, 1, 0, 0);
    }

    function sampleWave(analyser, raw, target, time, channel, playing) {
      const n = target.length;
      if (playing && analyser && raw) {
        analyser.getByteTimeDomainData(raw);
        const step = raw.length / n;
        for (let i = 0; i < n; i++) {
          const start = Math.floor(i * step);
          const end = Math.max(start + 1, Math.floor((i + 1) * step));
          let acc = 0;
          for (let j = start; j < end; j++) acc += raw[j];
          const v = ((acc / (end - start)) - 128) / 128;
          target[i] = target[i] * 0.84 + v * 0.16;
        }
        return;
      }
      for (let i = 0; i < n; i++) {
        const x = i / (n - 1);
        const idle = Math.sin((x * 3.6 + time * (0.55 + channel * 0.12)) * Math.PI) * 0.22
          + Math.sin((x * 6.2 + time * 0.32) * Math.PI) * 0.07;
        target[i] = target[i] * 0.9 + idle * 0.1;
      }
    }

    function smoothNeighbors(samples, out) {
      const n = samples.length;
      for (let i = 0; i < n; i++) {
        const a = samples[Math.max(0, i - 2)];
        const b = samples[Math.max(0, i - 1)];
        const c = samples[i];
        const d = samples[Math.min(n - 1, i + 1)];
        const e = samples[Math.min(n - 1, i + 2)];
        out[i] = (a + b * 2 + c * 3 + d * 2 + e) / 9;
      }
      return out;
    }

    function drawWave(samples, midY, amp, stroke, glow, fill) {
      const width = visualizer.width;
      const n = samples.length;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, midY + samples[0] * amp);
      for (let i = 1; i < n; i++) {
        const x0 = ((i - 1) / (n - 1)) * width;
        const x1 = (i / (n - 1)) * width;
        const y0 = midY + samples[i - 1] * amp;
        const y1 = midY + samples[i] * amp;
        const cpx = (x0 + x1) / 2;
        canvasCtx.quadraticCurveTo(x0, y0, cpx, (y0 + y1) / 2);
      }
      canvasCtx.lineTo(width, midY + samples[n - 1] * amp);
      canvasCtx.lineWidth = Math.max(2.4, width / 420);
      canvasCtx.strokeStyle = stroke;
      canvasCtx.shadowColor = glow;
      canvasCtx.shadowBlur = reduceMotion ? 0 : 18;
      canvasCtx.lineJoin = 'round';
      canvasCtx.lineCap = 'round';
      canvasCtx.stroke();

      canvasCtx.shadowBlur = 0;
      canvasCtx.lineTo(width, midY);
      canvasCtx.lineTo(0, midY);
      canvasCtx.closePath();
      canvasCtx.fillStyle = fill;
      canvasCtx.fill();
    }

    function drawVisualizer(ts) {
      animationId = requestAnimationFrame(drawVisualizer);
      const width = visualizer.width;
      const height = visualizer.height;
      if (!width || !height) return;

      const time = (ts || 0) / 1000;
      const pan = panNode ? panNode.pan.value : parseFloat(panRange.value);
      const playing = Boolean(isPlaying && analyserL && analyserR);

      sampleWave(analyserL, viz.rawL, viz.smoothL, time, 0, playing);
      sampleWave(analyserR, viz.rawR, viz.smoothR, time, 1, playing);

      canvasCtx.fillStyle = '#050505';
      canvasCtx.fillRect(0, 0, width, height);

      const bg = canvasCtx.createLinearGradient(0, 0, 0, height);
      bg.addColorStop(0, 'rgba(80, 12, 12, 0.22)');
      bg.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
      bg.addColorStop(1, 'rgba(80, 12, 12, 0.28)');
      canvasCtx.fillStyle = bg;
      canvasCtx.fillRect(0, 0, width, height);

      canvasCtx.strokeStyle = 'rgba(255,255,255,0.06)';
      canvasCtx.lineWidth = 1;
      canvasCtx.beginPath();
      canvasCtx.moveTo(0, height * 0.5);
      canvasCtx.lineTo(width, height * 0.5);
      canvasCtx.stroke();

      const leftAmp = height * (0.22 + Math.max(0, -pan) * 0.1);
      const rightAmp = height * (0.22 + Math.max(0, pan) * 0.1);
      const leftAlpha = 0.78 + Math.max(0, -pan) * 0.22;
      const rightAlpha = 0.78 + Math.max(0, pan) * 0.22;

      drawWave(
        smoothNeighbors(viz.smoothL, viz.drawL),
        height * 0.36,
        leftAmp,
        `rgba(255,255,255,${leftAlpha})`,
        'rgba(229,57,53,0.95)',
        'rgba(229,57,53,0.10)'
      );
      drawWave(
        smoothNeighbors(viz.smoothR, viz.drawR),
        height * 0.64,
        rightAmp,
        `rgba(255,210,205,${rightAlpha})`,
        'rgba(255,255,255,0.55)',
        'rgba(255,255,255,0.06)'
      );

      const vignette = canvasCtx.createRadialGradient(
        width * 0.5, height * 0.5, height * 0.15,
        width * 0.5, height * 0.5, height * 0.75
      );
      vignette.addColorStop(0, 'rgba(0,0,0,0)');
      vignette.addColorStop(1, 'rgba(0,0,0,0.38)');
      canvasCtx.fillStyle = vignette;
      canvasCtx.fillRect(0, 0, width, height);
    }

    function updatePanUI(balance) {
      const pct = ((balance + 1) / 2) * 100;
      panTrack.style.setProperty('--thumb', `${pct}%`);
      leftLabel.classList.toggle('active', balance < -0.08);
      rightLabel.classList.toggle('active', balance > 0.08);
    }

    Object.keys(TRACKS).forEach((id) => {
      const audio = createPlayer(TRACKS[id].src);
      audio.addEventListener('canplaythrough', () => setTrackStatus(id, 'готово', true), { once: true });
      audio.addEventListener('error', () => setTrackStatus(id, 'ошибка', false), { once: true });
      players[id] = audio;
    });

    document.querySelectorAll('.track-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        await unlockAudio();
        await selectTrack(btn.dataset.track, true);
      });
    });

    playBtn.addEventListener('click', async () => {
      await unlockAudio();
      const audio = currentPlayer();
      ensureGraph(audio);
      audio.play();
    });

    pauseBtn.addEventListener('click', () => currentPlayer()?.pause());

    stopBtn.addEventListener('click', () => {
      const audio = currentPlayer();
      if (!audio) return;
      audio.pause();
      audio.currentTime = 0;
    });

    seekRange.addEventListener('pointerdown', () => { seeking = true; });
    seekRange.addEventListener('pointerup', () => { seeking = false; });
    seekRange.addEventListener('input', () => {
      const audio = currentPlayer();
      if (!audio || !audio.duration) return;
      audio.currentTime = (Number(seekRange.value) / 1000) * audio.duration;
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    panRange.addEventListener('input', () => {
      const balance = parseFloat(panRange.value);
      if (panNode) panNode.pan.value = balance;
      updatePanUI(balance);
    });

    window.addEventListener('resize', () => {
      window.clearTimeout(window.__vizResize);
      window.__vizResize = window.setTimeout(initVisualizer, 120);
    });
    window.addEventListener('orientationchange', () => {
      window.setTimeout(initVisualizer, 250);
    });

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => playBtn.click());
      navigator.mediaSession.setActionHandler('pause', () => pauseBtn.click());
      navigator.mediaSession.setActionHandler('stop', () => stopBtn.click());
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBar.classList.add('visible');
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installBar.classList.remove('visible');
        return;
      }
      alert('На iPhone: «Поделиться» → «На экран Домой». На Android откройте меню браузера и выберите «Установить приложение».');
    });

    installDismiss.addEventListener('click', () => installBar.classList.remove('visible'));

    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
    if (ios && !standalone) {
      installText.textContent = 'На iPhone: Поделиться → На экран «Домой»';
      installBar.classList.add('visible');
      installBtn.textContent = 'Как установить';
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const base = window.location.href.endsWith('/') ? window.location.href : `${window.location.href}/`;
        const swUrl = new URL('sw.js', base);
        navigator.serviceWorker.register(swUrl.href, { scope: new URL('./', swUrl).href });
      });
    }

    initVisualizer();
    updateNowPlaying();
    updatePanUI(0);
    requestAnimationFrame(drawVisualizer);
    Promise.all(Object.keys(TRACKS).map(warmupTrack));
  </script>
</body>
</html>
