plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def uploadCloudFile = rootProject.file("upload-cloud.properties")
def uploadCloudProps = new Properties()
if (uploadCloudFile.exists()) {
    uploadCloudFile.withInputStream { uploadCloudProps.load(it) }
}
def uploadFunctionUrl = (uploadCloudProps["UPLOAD_FUNCTION_URL"] ?: "").toString().replace("\\", "\\\\").replace("\"", "\\\"")
def uploadStandSecret = (uploadCloudProps["UPLOAD_STAND_SECRET"] ?: "").toString().replace("\\", "\\\\").replace("\"", "\\\"")
def uploadUseCloud = (uploadCloudProps["UPLOAD_USE_CLOUD"] ?: "false").toString().toBoolean().toString()

android {
    namespace 'com.aerocell.stand'
    compileSdk 34

    defaultConfig {
        applicationId "com.aerocell.stand"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.6.1"

        vectorDrawables {
            useSupportLibrary = true
        }

        buildConfigField "String", "CONTENT_MANIFEST_URL", "\"https://storage.yandexcloud.net/aerocell-stand/manifest.json\""
        buildConfigField "String", "UPLOAD_FUNCTION_URL", "\"${uploadFunctionUrl}\""
        buildConfigField "String", "UPLOAD_STAND_SECRET", "\"${uploadStandSecret}\""
        buildConfigField "boolean", "UPLOAD_USE_CLOUD", uploadUseCloud
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
